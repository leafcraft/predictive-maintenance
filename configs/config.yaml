# predictive-maintenance — Predictive-Maintenance Pod
#
# A pod of digital employees + human roles that runs an asset from a
# condition signal to a repaired, audited work order: sense -> predict RUL
# (deterministic safety floors) -> plan the work order (parts gate) ->
# reliability-engineer review on shutdown/parts-gap -> ISSUE the approved
# work-order pack -> dispatch a technician -> WORM audit. Alongside it:
# spare-parts demand forecasting, asset lifecycle (replace/overhaul), and
# OSHA safety-incident classification.
#
# The pod is a TEAM, not a pipeline. Every wire is conditional; every
# hand-off is a finished contract; every human gate default-denies on
# silence; the finisher produces the real artifact and fails closed; the
# WORM sink is the terminus. Systems (historian / CMMS / ERP-MRP) are
# TOOLS inside agents, never members.
#
# Design doctrine: .claude/skills/leafmesh/building-agents-thoroughly.md
# Field reference:  .claude/skills/leafmesh/agent-config-fields.md

name: "predictive-maintenance"
version: "1.0.0"
architecture: "managed_mesh"
environment: "development"
debug: true
log_level: "INFO"

persistence:
  backend: redis
  redis:
    host: "${REDIS_HOST:localhost}"
    port: ${REDIS_PORT:6379}
    db: 0
    password: "${REDIS_PASSWORD:}"
    auto_storage: true
    decode_responses: true
    default_ttl: 86400
    session_ttl: 604800

auto_discover:
  directory: "./agency"
  pattern: "*_agent.py"
  recursive: false

# The Manager is the SUPERVISOR — it watches every hand-off and escalates
# stalls / contract violations / repeated errors to the Ops Manager. It is
# NOT a router in the middle of the team (static routing).
manager:
  model: "gpt-4o-mini"
  domain: "generic"
  prompt: |
    This mesh runs predictive maintenance. A successful turn flows:
    condition signal -> Cass (sense) -> Rex (predict RUL, deterministic
    safety floors) -> Wanda (plan the work order, parts gate) -> the
    reliability engineer reviews shutdown/parts-gap decisions -> Ivan
    ISSUES the approved work-order pack and dispatches a technician ->
    WORM audit. Escalate to the Ops Manager when: a predicted failure is
    inside the 24h window OR the asset is safety-critical, a part's lead
    time exceeds the remaining useful life, an asset loops on re-work past
    its bound, a human gate times out, or any agent hands off a malformed
    artifact. Silence never advances a work order.
  routing:
    mode: "static"
  escalation:
    targets:
      - type: "human_agent"
        agent: "ops_manager_human"
      - type: "webhook"
        url: "${PAGER_WEBHOOK:https://events.pagerduty.com/v2/enqueue}"
        method: "POST"
        headers:
          Content-Type: "application/json"
        payload_template:
          incident_id: "{{asset_id}}"
          severity: "{{severity}}"
          message: "{{message}}"
          session_id: "{{session_id}}"
      - type: "channel"
        provider: "slack"
        channel_id: "${SLACK_MAINT_CHANNEL:}"
        message_template: "[maint] {{message}} — asset {{asset_id}}"
    auto_escalate:
      max_retries: 2
      max_errors_per_session: 3
      timeout_threshold: 2

mesh:
  call_timeout: 150

# 2.4.131 runtime block — RUL analysis runs a Super-Agent plan/execute/
# verify loop that can run long. The 2.4.131 default dropped to 90s; this
# block is REJECTED by <=2.4.130, so it lands with the 2.4.131 floor.
timeouts:
  llm_hard_timeout_s: 300

# ── IIoT event source (BRD-021) — Cass binds a live condition-signal
#    stream here (see listen_events). Inert until IIOT_MQTT_HOST is set;
#    the pod runs day-0 on the seed store with no broker. ──
brokers:
  plant_iiot:
    type: mqtt
    host: "${IIOT_MQTT_HOST:}"
    port: ${IIOT_MQTT_PORT:1883}

# Documents the ingress event shape (a condition reading from your
# historian / IIoT platform). Optional; kept as a contract note.
data_structures:
  MaintEvent:
    type: "object"
    properties:
      asset_id: { type: "string" }
      asset_type: { type: "string" }
      reading: { type: "object" }
      received_at_utc: { type: "string" }
    required: ["asset_id"]

# ── Entry points — one per real-world trigger ────────────────────────────────
entry_points:
  - name: "sensor_reading"
    target: "mira_coordinator_agent"
    description: "A reactive IIoT condition reading arrives — Mira opens the case."
    condition: always

  - name: "case_status"
    target: "mira_coordinator_agent"
    description: "Anyone asks 'where is this asset's work order?' — Mira answers from the case record."
    condition: always

  - name: "scheduled_inspection"
    target: "condition_sensor_agent"
    description: "Routine PM fleet sweep (cron) — Cass fans across assets (instances) and reads each."
    condition: always

  - name: "work_order_filed"
    target: "work_order_scheduler_agent"
    description: "Technician/operator-filed work order — plan window/type/parts."
    condition: always

  - name: "parts_arrived"
    target: "work_order_scheduler_agent"
    description: "Parts inbound — re-run the WO plan against the same work order id."
    condition: always

  - name: "shutdown_request"
    target: "reliability_engineer_human"
    description: "Manual shutdown request — straight to the reliability engineer."
    condition: always

  - name: "engineer_reply"
    target: "reliability_engineer_human"
    description: "HITL resume — the engineer approves/holds a review."
    condition: always

  - name: "work_order_ingest"
    target: "maintenance_records_agent"
    description: "Record one work order (planned, corrective, emergency) in the CMMS ledger."
    condition: always

  - name: "asset_history_query"
    target: "maintenance_records_agent"
    description: "Read maintenance history for one or all assets."
    condition: always

  - name: "pm_compliance_report"
    target: "maintenance_records_agent"
    description: "PM completion-rate report by asset class (mode: pm_compliance)."
    condition: always

  - name: "weekly_parts_forecast"
    target: "spare_parts_forecaster_agent"
    description: "Mon 08:00 — 90-day parts demand forecast for procurement."
    condition: always

  - name: "shutdown_parts_plan"
    target: "spare_parts_forecaster_agent"
    description: "Planned shutdown announced — model parts demand for the outage window."
    condition: always

  - name: "emergency_parts_request"
    target: "spare_parts_forecaster_agent"
    description: "Equipment failed — urgent same-day parts demand + supplier ETA."
    condition: always

  - name: "equipment_lifecycle_assess"
    target: "equipment_lifecycle_agent"
    description: "Per-asset lifecycle scoring — continue / overhaul / replace."
    condition: always

  - name: "safety_incident_report"
    target: "safety_incident_reporter_agent"
    description: "Normalise a safety incident → OSHA severity + filing requirements."
    condition: always

  # ── Direct-call entry points — every non-human, non-terminal agent is
  #    API-addressable for ad-hoc invocation / debugging (bypasses the chain).
  - name: "direct_call_failure_predictor"
    target: "failure_predictor_agent"
    description: "On-demand direct call to Rex (llm super-agent) — bypasses upstream chain."
    condition: always

  - name: "direct_call_work_order_issuer"
    target: "work_order_issuer_agent"
    description: "On-demand direct call to Ivan (programmatic finisher) — bypasses upstream chain."
    condition: always

agents:

  # ─────────────────────────────────────────────────────────────────────────
  # Mira — Maintenance Coordinator (AI). Owns the case end to end: opens it on
  # a reactive condition reading, orchestrates the pod, keeps live status, is
  # the reliability team's one contact. Pure orchestration — never reads a
  # sensor, never plans a work order, never approves. (Pure YAML.)
  # ─────────────────────────────────────────────────────────────────────────
  mira_coordinator_agent:
    name: mira_coordinator_agent
    communication_type: chain
    agent_type: llm
    model: "gpt-4o-mini"
    temperature: 0.1
    description: "Maintenance Coordinator — opens the case, orchestrates, keeps status, single point of contact."
    prompt: |
      You are Mira, the Maintenance Coordinator. You OWN each maintenance case
      from the moment a condition reading arrives to the moment the work order
      is issued and audited. You orchestrate the pod and keep the reliability
      team informed — you never read a sensor, plan a work order, or approve a
      shutdown yourself.

      On a new condition reading: open a case, record the asset and the time,
      and hand it to Rex (the reliability analyst) to score. On a status ask:
      answer current stage / waiting-on / next gate from the case record —
      nothing invented. Route an explicit shutdown demand or a stuck case to
      the reliability engineer; never make the safety call yourself.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"action": ..., "case_id": ..., "asset_id": ..., "stage": ..., "waiting_on": ..., "summary": ...}
    yields:
      action: "string"        # open_case | status | escalate
      case_id: "string"
      asset_id: "string"
      stage: "string"
      waiting_on: "string"
      summary: "string"
    can_call:
      - agent: "failure_predictor_agent"
        condition: "calling_agent_response.action == 'open_case'"
      - agent: "reliability_engineer_human"
        condition: "calling_agent_response.action == 'escalate'"

  # ─────────────────────────────────────────────────────────────────────────
  # Cass — Condition-Monitoring Engineer (AI/programmatic reader). Pulls the
  # vibration / temp / current signature for an asset and flags anomalies.
  # The PROACTIVE reader: a scheduled fleet sweep (wake_up) and a live IIoT
  # stream (listen_events) both fan CASS across many assets — `instances`
  # spins up parallel copies and each ATOMICALLY CLAIMS the next asset from
  # the inspection backlog (claim_next_asset), so copies split the fleet
  # instead of duplicating work. Day-0 it reads the seed store and announces
  # `available:false` when there is no historian and no seed. (Module:
  # agency/condition_sensor_agent.py.)
  # ─────────────────────────────────────────────────────────────────────────
  condition_sensor_agent:
    name: "condition_sensor_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Condition-Monitoring Engineer — reads vibration/temp/current for an asset, flags anomalies."
    # Asset fan-out (2.4.118+): one sweep/stream activation → 3 parallel copies,
    # each atomically CLAIMS a disjoint asset (store.claim_next_asset — the same
    # atomic op exposed as the claim_next_asset global tool) so copies split the
    # fleet instead of duplicating work.
    instances: 3
    instances_handoff: each          # each anomalous asset routes its own prediction
    # Routine PM fleet sweep — daily, in the plant's timezone (NOT UTC). Runs
    # day-0 against the seed store; needs no connector. ONE cron line — with
    # instances:3 that is 3 runs (one per claimed asset), not 3×N.
    wake_up: "0 6 * * *"
    timezone: "Asia/Kolkata"
    wake_up_input:
      trigger: scheduled_inspection
    # Live IIoT stream — binds to the plant_iiot broker (top-level `brokers:`).
    # Inert until IIOT_MQTT_HOST is set; parallel to wake_up.
    listen_events:
      - broker: plant_iiot
        mqtt_topic: "plant/+/condition"
        qos: 1
    # ── To wire a real historian, uncomment and set the URL (each named action
    #    under `use:` becomes its own tool, e.g. historian_read_signals). NOTE:
    #    the SDK rejects an http mcp block with an EMPTY url at load, so this
    #    ships commented — fill the URL, then uncomment. Day-0 uses the
    #    read_condition_signals dev tool (seed store). ──
    # mcp:
    #   - transport: http
    #     url: "${HISTORIAN_MCP_URL}"     # PI / Ignition / ThingWorx gateway
    #     token: "${HISTORIAN_MCP_TOKEN:}"
    #     use: [read_signals, read_series]
    #     name: historian
    #     timeout: 30
    yields:
      asset_id: "string"
      sensor_summary: "object"
      anomaly_detected: "boolean"
      available: "boolean"
    inputs:
      payload: "object"
    can_call:
      - agent: "failure_predictor_agent"
        condition: "calling_agent_response.anomaly_detected == true"

  # ─────────────────────────────────────────────────────────────────────────
  # Rex — Predictive Reliability Analyst (AI, Super-Agent). Scores remaining
  # useful life, failure mode and confidence, and writes the engineer briefing.
  # This is where a false "all clear" is prevented: a low-confidence prediction
  # inside the shutdown window, or a high deterministic failure-probability
  # score, can NEVER pass as safe. super_agent = autonomous plan/execute/verify
  # across telemetry; the model PULLS its data via tools; @chain = the safety
  # floors (fail closed). Tools come from the historian connector + the day-0
  # dev tools; the playbook carries the craft. (Module:
  # agency/failure_predictor_agent.py.)
  # ─────────────────────────────────────────────────────────────────────────
  failure_predictor_agent:
    name: "failure_predictor_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 900
    max_tool_calls_per_message: 15   # multi-signal analysis; default 5 truncates silently
    description: "Predictive Reliability Analyst — RUL + failure mode + confidence, with deterministic safety floors."
    super_agent:                     # DICT form = the tuning path (2.4.123+); the ONLY way to tune it
      cost_ceiling: 120000
      wall_clock: 900
    prompt: |
      You are Rex, the Predictive Reliability Analyst. Your job is to turn an
      asset's condition signature into a remaining-useful-life (RUL) estimate,
      a failure mode, a confidence score, and a briefing the reliability
      engineer can act on — and to REFUSE to be optimistic about a degrading
      signature.

      Pull the telemetry series, the asset's maintenance history, and the
      deterministic failure-probability score with your tools FIRST — you
      cannot score an asset you have not read. Then estimate RUL (hours, never
      negative), name the failure mode (bearing_wear, seal_leak, …; "unknown"
      when unclear), a confidence 0–1, and write a 3–4 sentence engineer
      briefing citing the specific signature. Load the `rul_analysis` playbook
      for the read-before-score order and the `safety_policy` playbook for what
      forces a safety call. The agent enforces the safety floors
      deterministically after you answer — echo your best values; the floor is
      authoritative for safety_critical and failure_prob_24h.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"asset_id": ..., "predicted_failure_hours": ..., "failure_mode": ...,
       "confidence": ..., "safety_critical": ..., "failure_prob_24h": ...,
       "engineer_briefing": ...}
    yields:
      asset_id: "string"
      predicted_failure_hours: "number"
      failure_mode: "string"
      confidence: "number"
      safety_critical: "boolean"
      failure_prob_24h: "number"
      engineer_briefing: "string"
    # Playbook — the CRAFT, fetched on demand. Only `description` rides in the
    # prompt; `responsibility` is loaded when the model recognises the intent.
    playbook:
      - intent: rul_analysis
        description: "How to read a condition signature and score RUL honestly."
        responsibility: |
          1. Pull the telemetry series FIRST (read_condition_signals), then the
             asset history (read_condition_signals returns the recent record),
             then the deterministic failure-probability score — you cannot score
             an asset you have not fully read.
          2. Read the vibration RMS against baseline (ISO 10816 banding), the
             temperature drift, and the current draw. A rising trend across the
             series is worse than a single high sample.
          3. Estimate RUL in hours from the rate of degradation, not the latest
             value alone. Name the dominant failure mode from the signature.
          4. Score confidence honestly: a noisy or short series is LOW
             confidence — say so, do not average it away.
        variables: [asset_id]
      - intent: safety_policy
        description: "What forces a safety call the analyst cannot waive."
        responsibility: |
          1. A prediction inside the 24h shutdown window at low confidence is
             treated DEFENSIVELY — safety_critical, not "probably fine".
          2. A high deterministic failure-probability score (>= 0.7) means
             failure within 24h is likely: the RUL is clamped into the window
             regardless of an optimistic estimate.
          3. A safety-critical asset (leak / fire / pinch hazard on failure)
             always routes the reliability engineer.
        variables: [asset_id]
    enforce_yields: true
    enforce_yields_retry: 2
    # Day-0 tool surface — reads the seed store so the pod runs with NO
    # historian wired. Each tool announces itself (available:false) when there
    # is no real source. See agency/tools.py.
    tools: [read_condition_signals, read_asset_history, failure_probability_score]
    tool_categories: [reliability]
    inputs:
      upstream_yields: "object"
      asset_id: "string"
    can_call:
      # A valid prediction always yields a work-order plan (fails closed if the
      # field is absent).
      - agent: "work_order_scheduler_agent"
        condition: "calling_agent_response.predicted_failure_hours >= 0"
      # Deterministic safety floor (enforced by @chain AND this wire): a forced
      # safety_critical flag, OR a low-confidence prediction inside the 24h
      # window, loops in the reliability engineer regardless of the LLM's optimism.
      - agent: "reliability_engineer_human"
        condition: "calling_agent_response.safety_critical == true or (calling_agent_response.predicted_failure_hours < 24 and calling_agent_response.confidence < 0.7)"

  # ─────────────────────────────────────────────────────────────────────────
  # Wanda — Maintenance Planner (AI/programmatic specialist). Turns a
  # prediction into a work-order PLAN: picks the window + work type, runs the
  # parts-availability gate (fail-closed lead-time-vs-RUL), refuses an
  # untraceable work order, and sets the priority floor. Deliberately does NOT
  # dispatch — the planner is not the issuer (a second pass, behind the human
  # gate, actuates). Bounds the technician re-work back-edge (exhaustion
  # counter → engineer). (Module: agency/work_order_scheduler_agent.py.)
  # ─────────────────────────────────────────────────────────────────────────
  work_order_scheduler_agent:
    name: "work_order_scheduler_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Maintenance Planner — picks the window + work type, runs the parts gate, sets the priority floor."
    yields:
      work_order_id: "string"
      window_start_utc: "string"
      work_type: "string"               # planned | corrective | emergency | unscheduled_review
      priority: "string"                # P1 | P2 | P3 — set by the @chain priority floor
      requires_engineer_review: "boolean"
      parts_available: "boolean"
      lead_time_hours: "number"
      parts_short: "list"
      failure_mode: "string"
      rework_rounds: "number"
      rework_exhausted: "boolean"       # bounded back-edge tripped → terminal engineer route
    inputs:
      predicted_failure_hours: "number"
      safety_critical: "boolean"
      work_order_id: "string"
      failure_mode: "string"
    narration: |
      Plan-only (never dispatches):
        1. schedule — failure < 24h OR safety_critical → emergency + engineer
           review; 24–168h → corrective; > 168h → planned.
        2. parts gate — a part not on hand, or lead time > RUL → parts_available
           false (no issue; engineer route).
        3. priority floor (@chain) — P1 emergency / P2 corrective / P3 planned;
           an emergency can't be down-ranked.
        4. bounded re-work — a technician's parts_issue re-enters here; past the
           bound, rework_exhausted → engineer (terminal).
    can_call:
      # Routine, parts on hand, no engineer needed, not exhausted → the finisher
      # issues + dispatches.
      - agent: "work_order_issuer_agent"
        condition: "calling_agent_response.parts_available == true and calling_agent_response.requires_engineer_review == false and calling_agent_response.rework_exhausted == false"
      # Emergency/safety review, a parts gap, or an exhausted re-work loop → the
      # reliability engineer (one edge, gated on the union).
      - agent: "reliability_engineer_human"
        condition: "calling_agent_response.requires_engineer_review == true or calling_agent_response.parts_available == false or calling_agent_response.rework_exhausted == true"

  # ─────────────────────────────────────────────────────────────────────────
  # Ivan — Work-Order Issuer (programmatic FINISHER). Sits BEHIND the human
  # gate. It never authorises a shutdown or issues on its own belief: it
  # re-checks authorisation (allow/deny tokens, unknown fails closed),
  # enforces invariants a human can't waive (a traceable work order, parts
  # actually on hand, not an untraceable job), renders the approved work-order
  # pack to ./out, DELETES it on a tripped floor, dispatches the technician,
  # and records an append-only ledger. Day-0 it recovers the work order across
  # the HITL gap (session stash / dev store) and writes a verifiable dev-store
  # record — never a fake dispatch ack. (Module: agency/work_order_issuer_agent.py.)
  # ─────────────────────────────────────────────────────────────────────────
  work_order_issuer_agent:
    name: "work_order_issuer_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Work-Order Issuer — auth re-check → invariants → render pack → delete-on-block → dispatch → ledger."
    yields:
      issued: "boolean"
      authorized: "boolean"
      work_order_id: "string"
      pack_path: "string"
      dispatched_to: "string"           # technician | held_pending_parts | held_unauthorized | held_untraceable
      status: "string"                  # issued | blocked
      block_reasons: "list"
    inputs:
      upstream_yields: "object"
      work_order_id: "string"
    can_call:
      - agent: "technician_human"
        condition: "calling_agent_response.dispatched_to == 'technician'"
      - agent: "maint_audit_logger_agent"
        condition: always

  # ─────────────────────────────────────────────────────────────────────────
  # Human members — first-class, reached in the channel they already live in.
  # Every gate DEFAULT-DENIES on timeout (fallback -> held_for_review -> audit).
  # `dual` belongs on the human/webhook boundary agents ONLY; a human never
  # can_call another `dual` human (that ping-pongs) — escalation between humans
  # is the Manager SUPERVISOR's job (manager.escalation.targets).
  # ─────────────────────────────────────────────────────────────────────────

  reliability_engineer_human:
    name: "reliability_engineer_human"
    agent_type: "human"
    human_interface: "webhook"
    communication_type: "dual"
    human_timeout_seconds: 14400        # 4h to review a shutdown / parts-gap
    description: "Reliability engineer — reviews shutdown / unscheduled / parts-gap decisions; approves or holds."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    webhook_config:
      outbound_url: "${HITL_OUTBOUND_URL:http://127.0.0.1:9999/human-notify}"
      outbound_headers: {Content-Type: "application/json"}
      outbound_timeout: 30
      max_retries: 1
      retry_delay: 2
    # operator_ids: ["you@yourcompany.com"]   # optional — unset routes to the
    #   SHARED inbox. Only set real emails: a placeholder assigns to nobody.
    can_call:
      - agent: "work_order_issuer_agent"
        condition: "calling_agent_response.human_message == 'approved'"
      - agent: "maint_audit_logger_agent"
        condition: "calling_agent_response.human_message == 'held_for_review'"
    yields:
      human_message: "string"           # approved | held_for_review
    inputs:
      briefing: "object"

  technician_human:
    name: "technician_human"
    agent_type: "human"
    human_interface: "webhook"
    communication_type: "dual"
    human_timeout_seconds: 7200         # 2h to do / report the repair
    description: "Maintenance technician — does the repair; reports completed / parts_issue."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    webhook_config:
      outbound_url: "${HITL_OUTBOUND_URL:http://127.0.0.1:9999/human-notify}"
      outbound_headers: {Content-Type: "application/json"}
      outbound_timeout: 30
    can_call:
      # Bounded re-work back-edge: a parts problem re-enters the planner, which
      # counts the rounds and escalates to the engineer at the cap.
      - agent: "work_order_scheduler_agent"
        condition: "calling_agent_response.human_message == 'parts_issue'"
      - agent: "maint_audit_logger_agent"
        condition: "calling_agent_response.human_message == 'completed' or calling_agent_response.human_message == 'held_for_review'"
    yields:
      human_message: "string"           # completed | parts_issue | held_for_review
    inputs:
      work_order: "object"

  ops_manager_human:
    name: "ops_manager_human"
    agent_type: "human"
    human_interface: "webhook"
    communication_type: "dual"
    human_timeout_seconds: 21600        # 6h — production-impact tier
    description: "Ops manager — production-impact tier: capex sign-off, safety escalations, held flows."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    webhook_config:
      outbound_url: "${HITL_OUTBOUND_URL:http://127.0.0.1:9999/human-notify}"
      outbound_headers: {Content-Type: "application/json"}
      outbound_timeout: 30
    can_call:
      - agent: "maint_audit_logger_agent"
        condition: always
    yields:
      human_message: "string"
    inputs:
      matter: "object"

  # ─────────────────────────────────────────────────────────────────────────
  # WORM audit sink — hash-chained, append-only, the terminus of every path.
  # Registered in main.py via sdk.intelligence("maint_audit_logger_agent").
  # ─────────────────────────────────────────────────────────────────────────
  maint_audit_logger_agent:
    name: "maint_audit_logger_agent"
    agent_type: "external"
    framework: "custom"
    communication_type: "execute"
    description: "WORM audit — hash-chains every issue, dispatch, approval, hold, and forecast. Terminus."
    connector_config:
      sink_type: "local_file"
      local_file_path: "./logs/maint_audit.jsonl"
    yields:
      audit_event_id: "string"
      written_at_utc: "string"
      hash_chain_prev: "string"
      hash_chain_current: "string"
    inputs:
      session_id: "string"
      payload: "object"
    can_call: []

  # ─────────────────────────────────────────────────────────────────────────
  # Perry — Spare-Parts Demand Planner (AI). Forecasts 30/60/90-day parts
  # demand from the fleet's consumption run-rate; flags critical shortages and
  # overstock for procurement. @pre_compose pulls its own inventory + run-rate;
  # @chain forces a known stockout into critical_shortages (LLM-unwaivable).
  # Weekly cron stays live (needs no connector). (Module:
  # agency/spare_parts_forecaster_agent.py.)
  # ─────────────────────────────────────────────────────────────────────────
  spare_parts_forecaster_agent:
    name: "spare_parts_forecaster_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 1200
    description: "Spare-Parts Demand Planner — 30/60/90-day forecast; critical shortages + overstock for procurement."
    wake_up: "0 8 * * 1"               # Monday 08:00 — weekly forecast refresh
    timezone: "Asia/Kolkata"           # crons run in UTC unless a timezone is set
    wake_up_input:
      trigger: weekly_parts_forecast
    prompt: |
      You are Perry, the Spare-Parts Demand Planner. Forecast 90-day spare-parts
      demand from the fleet's real consumption run-rate and feed procurement a
      forecast it can act on — being CONSERVATIVE, because a wrong forecast that
      triggers premature reorders erodes trust.

      The inventory and per-SKU run-rate are pulled for you before you answer
      (over the real issues ledger, not a guess). Forecast per horizon, flag the
      slow-movers tying up capital as overstock, and score confidence honestly
      (0–1, per-part and overall). Load the `demand_forecast` playbook for how to
      turn a run-rate into a horizon forecast. The agent forces any SKU that
      will stock out within its lead time into critical_shortages after you
      answer — you cannot optimistically drop a known stockout.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"parts_needed_30d": ..., "parts_needed_60d": ..., "parts_needed_90d": ...,
       "critical_shortages": ..., "overstock_candidates": ..., "executive_summary": ...,
       "confidence_overall": ...}
    yields:
      parts_needed_30d: "list"
      parts_needed_60d: "list"
      parts_needed_90d: "list"
      critical_shortages: "list"
      overstock_candidates: "list"
      executive_summary: "string"
      confidence_overall: "number"
    playbook:
      - intent: demand_forecast
        description: "How to turn a consumption run-rate into a 30/60/90-day forecast."
        responsibility: |
          1. For each SKU, take the trailing consumption over the window and its
             daily run-rate; project demand across 30 / 60 / 90 days.
          2. Compare projected demand against on-hand + lead time. A SKU that
             stocks out before a reorder can land is a critical shortage.
          3. A SKU with many months of cover and no recent draws is an overstock
             candidate — capital tied up.
          4. Confidence tracks the length + stability of the run-rate; a single
             draw is not a trend.
        variables: []
    enforce_yields: true
    enforce_yields_retry: 1
    inputs:
      trigger: "string"
    can_call:
      - agent: "ops_manager_human"
        condition: "calling_agent_response.critical_shortages != []"
      - agent: "maint_audit_logger_agent"
        condition: always

  # ─────────────────────────────────────────────────────────────────────────
  # Mara — Maintenance Records Analyst (programmatic connector). WO ledger /
  # MTBF, PM-compliance tracking, daily recurrence sweep — mode-dispatched
  # inside YOUR CMMS. A pure connector: it reaches the CMMS as a TOOL and is
  # inert until CMMS_MCP_URL is set (no template storage as system of record).
  # ─────────────────────────────────────────────────────────────────────────
  maintenance_records_agent:
    name: "maintenance_records_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Maintenance Records Analyst — WO ledger/MTBF, PM-compliance, recurrence sweep (CMMS)."
    # ── YOUR SYSTEM OF RECORD ──────────────────────────────────────────────
    # Work orders live in your CMMS, not this template. Point this connector at
    # an MCP gateway (Maximo, Fiix, eMaint) that receives `mode` (ingest_wo |
    # schedule_pm | report | pm_compliance | recurrence_sweep) and returns the
    # yields below. Inert until CMMS_MCP_URL is set.
    integration: "mcp"
    connector_config:
      transport: "http"
      url: "${CMMS_MCP_URL:}"
      tool_name: "get_maintenance_history"
      timeout: 30
    # wake_up: "0 7 * * *"   # daily recurrence sweep — enable (with a timezone)
    #   after wiring your CMMS connector; it would hammer an unwired gateway.
    yields:
      mode: "string"
      asset_id: "string"
      failures_count: "number"
      total_cost_cents: "number"
      total_downtime_mins: "number"
      mtbf_days: "number"
      overdue_pm_count: "number"
      overdue_pms: "list"
      requires_engineer_review: "boolean"
      history_briefing: "string"
      horizon_days: "number"
      total_pms: "number"
      completed_on_time: "number"
      overdue_count: "number"
      overall_compliance_pct: "number"
      by_asset_class: "list"
      requires_manager_action: "boolean"
      recurrent_asset_count: "number"
      recurrent_assets: "list"
    inputs:
      mode: "string"
      asset_id: "string"
      wo_kind: "string"
      opened_at_utc: "string"
      closed_at_utc: "string"
      cost_cents: "number"
      technician_id: "string"
      root_cause: "string"
      downtime_mins: "number"
      cadence_days: "number"
      last_completed: "string"
      horizon_days: "number"
      trigger: "string"
    can_call:
      # High-frequency failures or 3+ overdue PMs, or a recurrence hit → engineer.
      - agent: "reliability_engineer_human"
        condition: "calling_agent_response.requires_engineer_review == true or calling_agent_response.recurrent_asset_count > 0"
      # PM-compliance below target → ops manager.
      - agent: "ops_manager_human"
        condition: "calling_agent_response.requires_manager_action == true"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # Ellis — Asset Lifecycle Planner (AI). Age-vs-design-life + cost-to-keep-vs-
  # replace scoring → continue / overhaul / replace. @pre_compose pulls the
  # asset dossier (master + full history); @chain forces at least an overhaul
  # when past design life and over the replace threshold (LLM-unwaivable).
  # (Module: agency/equipment_lifecycle_agent.py.)
  # ─────────────────────────────────────────────────────────────────────────
  equipment_lifecycle_agent:
    name: "equipment_lifecycle_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 1500
    description: "Asset Lifecycle Planner — age, failure history, cost trajectory → continue / overhaul / replace."
    prompt: |
      You are Ellis, the Asset Lifecycle Planner. Decide whether an asset should
      continue, be overhauled, or be replaced — from real records, never
      invented numbers.

      The asset dossier (age, lifetime maintenance spend, failure count,
      replacement cost, warranty) is pulled for you before you answer; the
      deterministic ratios come from the dossier, not your imagination. Apply
      the decision policy, set the warranty judgement, and write the rationale.
      Load the `lifecycle_decision` playbook for the exact decision order. The
      agent enforces the past-life + over-threshold floor after you answer, and
      recomputes the capex/planning flags from the final action — a lenient
      "continue" can't slip a worn-out asset through.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"asset_id": ..., "asset_type": ..., "age_years": ..., "age_pct_of_design_life": ...,
       "cumulative_maint_cents": ..., "cost_to_keep_1y_cents": ..., "replacement_cost_cents": ...,
       "keep_vs_replace_ratio": ..., "failures_lifetime": ..., "warranty_window_days": ...,
       "warranty_action_window": ..., "recommended_action": ..., "requires_capex_approval": ...,
       "requires_maintenance_planning": ..., "assessed_at_utc": ...}
    yields:
      asset_id: "string"
      asset_type: "string"
      age_years: "number"
      age_pct_of_design_life: "number"
      cumulative_maint_cents: "number"
      cost_to_keep_1y_cents: "number"
      replacement_cost_cents: "number"
      keep_vs_replace_ratio: "number"
      failures_lifetime: "number"
      warranty_window_days: "number"
      warranty_action_window: "boolean"
      recommended_action: "string"
      requires_capex_approval: "boolean"
      requires_maintenance_planning: "boolean"
      assessed_at_utc: "string"
    playbook:
      - intent: lifecycle_decision
        description: "The continue / overhaul / replace decision order."
        responsibility: |
          Apply IN ORDER, do not deviate:
            1. age >= 1.2× design life AND keep-vs-replace ratio >= 0.25 → replace.
            2. age >= 1.0× design life AND >= 5 lifetime failures → overhaul.
            3. age >= 0.9× design life AND ratio >= 0.40 → replace.
            4. otherwise → continue.
          Set requires_capex_approval only when the action is replace; set
          requires_maintenance_planning only when the action is overhaul.
          warranty_action_window is true only when 0–60 days of warranty remain.
        variables: [asset_id]
    enforce_yields: true
    inputs:
      upstream_yields: "object"
      asset_id: "string"
    can_call:
      - agent: "ops_manager_human"
        condition: "calling_agent_response.requires_capex_approval == true or calling_agent_response.recommended_action == 'replace'"
      - agent: "work_order_scheduler_agent"
        condition: "calling_agent_response.requires_maintenance_planning == true or calling_agent_response.recommended_action == 'overhaul'"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # Sana — EHS / Safety Compliance Officer (AI). Classifies a safety incident;
  # the OSHA severity, reporting window and escalation route are forced
  # deterministically (29 CFR 1904.39/1904.7 are statutory data, never
  # hallucinated). @pre_compose grounds the narrative in the real asset; @chain
  # is the severity floor. (Module: agency/safety_incident_reporter_agent.py.)
  # ─────────────────────────────────────────────────────────────────────────
  safety_incident_reporter_agent:
    name: "safety_incident_reporter_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 1200
    description: "EHS / Safety Compliance Officer — classifies a safety incident → OSHA severity + required filings."
    prompt: |
      You are Sana, the EHS / Safety Compliance Officer. Normalise a safety
      incident so it can be reported correctly. Focus on getting the CLASSIFICATION
      right — incident_type, outcome, state — and be conservative: if the outcome
      is unclear, mark medical_treatment_beyond_first_aid (recordable) rather than
      first_aid_only (not recordable).

      The asset context is pulled for you before you answer. The severity, OSHA
      recordability, statutory reporting windows and escalation flags are computed
      deterministically from your classification after you answer — you cannot
      down-rate a recordable or serious incident. Load the `incident_taxonomy`
      playbook for the outcome vocabulary.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"incident_id": ..., "occurred_at_utc": ..., "asset_id": ..., "work_order_id": ...,
       "incident_type": ..., "outcome": ..., "state": ..., "severity": ...,
       "osha_recordable": ..., "osha_report_window_hours": ..., "state_filings_required": ...,
       "requires_safety_manager_review": ..., "requires_immediate_escalation": ...,
       "recorded_at_utc": ...}
    yields:
      incident_id: "string"
      occurred_at_utc: "string"
      asset_id: "string"
      work_order_id: "string"
      incident_type: "string"
      outcome: "string"
      state: "string"
      severity: "string"
      osha_recordable: "boolean"
      osha_report_window_hours: "number"
      state_filings_required: "list"
      requires_safety_manager_review: "boolean"
      requires_immediate_escalation: "boolean"
      recorded_at_utc: "string"
    playbook:
      - intent: incident_taxonomy
        description: "The incident_type / outcome vocabulary to classify into."
        responsibility: |
          incident_type: injury | near_miss | unsafe_condition.
          outcome: death, hospitalisation, amputation, eye_loss,
          medical_treatment_beyond_first_aid, restricted_work,
          days_away_from_work, loss_of_consciousness, first_aid_only.
          When unsure between two, pick the MORE serious (recordable) one — the
          floor can only be raised by a conservative call, never lowered.
        variables: [incident_id]
    enforce_yields: true
    inputs:
      upstream_yields: "object"
      incident_id: "string"
    can_call:
      - agent: "ops_manager_human"
        condition: "calling_agent_response.requires_immediate_escalation == true"
      - agent: "ops_manager_human"
        condition: "calling_agent_response.requires_safety_manager_review == true and calling_agent_response.requires_immediate_escalation == false"
    auto_store_response: true
    auto_store_yields: true
