version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: predictive-maintenance-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  predictive-maintenance:
    build: .
    container_name: predictive-maintenance
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "18820:18820"
    volumes:
      - ./logs:/app/logs

volumes:
  redis-data:
